name: Deploy to Render

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger deploy via Render API
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Missing RENDER_API_KEY or RENDER_SERVICE_ID. Add them to repository secrets.";
            exit 1;
          fi

          echo "Triggering Render deploy for service $RENDER_SERVICE_ID"
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")

          echo "Render response: $response"
          # persist response for later steps
          echo "RENDER_RESPONSE<<EOF" >> $GITHUB_ENV
          echo "$response" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # exit non-zero if API returns an error
          if echo "$response" | grep -qi "error"; then
            echo "Render API returned an error";
            exit 1;
          fi

      - name: Comment on PR with Render deploy info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const resp = process.env.RENDER_RESPONSE || 'No response';
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No pull request in context');
              return;
            }
            const body = `Triggered Render deploy for service ${process.env.RENDER_SERVICE_ID || 'unknown'}:\n\n\n` + '```
${resp}
```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
